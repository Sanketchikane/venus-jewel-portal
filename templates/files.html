<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Files • VENUS JEWEL FILE PORTAL</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='images/apple-touch-icon.png') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='images/favicon-32x32.png') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --vj-primary: #003366;
            --vj-accent: #0B5FFF;
            --vj-bg: rgba(255,255,255,.95);
            --vj-card: #ffffff;
            --vj-border: #e2e8f0;
            --vj-muted: #6b7280;
            --vj-hover: #eef4ff;
            --vj-shadow: 0 8px 20px rgba(0,0,0,.06);
        }

        body { margin:0; font-family:"Poppins",sans-serif; background:#f4f7fc; color:var(--vj-primary); }

        .topbar {
            background:var(--vj-bg); padding:10px 18px;
            border-bottom:1px solid var(--vj-border);
            display:flex; align-items:center; justify-content:space-between;
            gap:10px; flex-wrap:nowrap;
        }
        .topbar img { height:42px; }
        .top-right { display:flex; align-items:center; gap:10px; }
        .top-btn {
            padding:6px 12px; border:1px solid var(--vj-border);
            background:#fff; border-radius:8px; font-size:13px;
            cursor:pointer; display:flex; align-items:center; gap:6px;
        }
        .top-btn:hover { background:var(--vj-hover); }

        @media(max-width:600px){
            .topbar{padding:6px 10px; gap:6px; flex-wrap:wrap;}
            .topbar img{height:32px;}
            .top-right span{display:none;}
            .top-btn{font-size:11px;padding:4px 8px;}
        }

        .container {
            max-width:1280px; margin:18px auto; padding:14px;
            background:var(--vj-bg); border-radius:14px; box-shadow:var(--vj-shadow);
        }

        .controls { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:14px; align-items:center; }
        .controls input,.controls select{
            padding:10px;border-radius:8px;border:1px solid var(--vj-border);font-size:14px;
        }
        .btn {
            padding:8px 12px;border:1px solid var(--vj-border);background:#fff;border-radius:8px;
            cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.15s;
        }
        .btn-primary { background:var(--vj-accent); color:#fff; border-color:var(--vj-accent); }

        @media(max-width:600px){
            .controls{flex-direction:column;align-items:stretch;}
            .controls input,.controls select,.controls .btn{width:100%;}
        }

        .browser{display:grid;grid-template-columns:320px 1fr;gap:16px;}
        @media(max-width:900px){.browser{grid-template-columns:1fr;}}

        .panel{
            background:#fff;border:1px solid var(--vj-border);border-radius:12px;
            padding:14px;box-shadow:var(--vj-shadow);
        }

        .list{max-height:60vh;overflow-y:auto;border-radius:10px;border:1px solid var(--vj-border);}
        .list-item{
            padding:10px;display:flex;gap:12px;align-items:center;
            border-bottom:1px solid var(--vj-border);cursor:pointer;
        }
        .list-item:hover{background:var(--vj-hover);}
        .selected-folder{background:rgba(11,95,255,0.18)!important;border-left:4px solid var(--vj-accent);}
        .muted{margin-left:auto;color:var(--vj-muted);font-size:12px;}

        .table-wrap{overflow-x:auto;}
        table{width:100%;border-collapse:collapse;min-width:720px;}
        th,td{padding:10px;border-bottom:1px solid var(--vj-border);text-align:left;}
        th{background:#f8faff;font-weight:600;}

        @media(max-width:600px){table{min-width:720px;}}

        #loader,#fileLoader{
            display:none;margin:12px auto;width:36px;height:36px;border:4px solid #cfd5e1;
            border-top-color:#0B5FFF;border-radius:50%;animation:spin .75s linear infinite;
        }
        @keyframes spin{to{transform:rotate(360deg);}}

        #previewModal,#shareModal,#deleteModal{
            display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);
            z-index:4000;align-items:center;justify-content:center;
        }
        #previewBox,#shareBox,#deleteBox{
            width:min(680px,95vw);background:#fff;border-radius:10px;padding:18px;
            box-shadow:var(--vj-shadow);
        }
        #previewBox{background:#000;}
        #previewClose{
            position:absolute;right:10px;top:10px;background:#fff;border:none;
            border-radius:50%;width:36px;height:36px;cursor:pointer;
        }

        #deleteBox h3{margin:0;font-size:18px;}
        #deleteBox p{margin:10px 0;color:var(--vj-muted);}
        .delete-actions{display:flex;gap:10px;justify-content:flex-end;}
        .btn-danger{background:#ff4d4f;color:#fff;border-color:#ff4d4f;}
    </style>
</head>

<body>

<!-- ================= TOPBAR ================= -->
<div class="topbar">
    <img src="{{ url_for('static', filename='images/venus_black_logo.jpg') }}">
    <div class="top-right">
        <span><i class="fas fa-user-circle"></i> {{ user }}</span>
        <a class="top-btn" href="/dashboard"><i class="fas fa-arrow-left"></i> Dashboard</a>
        <a class="top-btn" href="/logout"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </div>
</div>

<!-- ================= MAIN ================= -->
<div class="container">

    <div class="controls">
        <input id="searchBox" placeholder="Search Packet No or File...">

        <select id="sortSelect">
            <option value="newest">Newest First</option>
            <option value="name">Name A–Z</option>
        </select>

        <button id="refreshBtn" class="btn">
            <i class="fa fa-rotate"></i> Refresh
        </button>

        <div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;">
            <button id="downloadSelectedBtn" class="btn btn-primary" disabled>
                <i class="fa fa-download"></i> Download Selected (<span id="selectedCount">0</span>)
            </button>

            <button id="shareFolderBtn" class="btn" disabled>
                <i class="fa fa-share-alt"></i> Share Folder
            </button>

            <button id="deleteFoldersBtn" class="btn" disabled>
                <i class="fa fa-trash"></i> Delete Folders
            </button>
        </div>
    </div>

    <div id="loader"></div>

    <div class="browser">

        <!-- LEFT PANEL -->
        <div class="panel">
            <h3><i class="fa fa-folder"></i> Packet Folders</h3>

            <label style="display:flex;gap:8px;align-items:center;margin-bottom:6px;">
                <input type="checkbox" id="selectAll"> <strong>Select All</strong>
            </label>

            <div class="list" id="packetList"></div>
        </div>

        <!-- RIGHT PANEL -->
        <div class="panel">
            <h3 id="filesTitle"><i class="fa fa-file"></i> Files</h3>
            <div id="fileLoader"></div>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Type</th>
                            <th>Modified</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="filesBody"></tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<!-- ================= Preview Modal ================= -->
<div id="previewModal">
    <div id="previewBox">
        <button id="previewClose">✕</button>
        <video id="previewVideo" controls></video>
        <img id="previewImage">
        <iframe id="previewFrame"></iframe>
    </div>
</div>

<!-- ================= Share Folder Modal ================= -->
<div id="shareModal">
    <div id="shareBox">
        <h3>Share Folder</h3>
        <div class="share-link" id="shareLink">Generating link…</div>
        <div style="display:flex;gap:10px;justify-content:flex-end;">
            <button id="copyShareLink" class="btn">Copy</button>
            <button id="openShareLink" class="btn btn-primary">Open</button>
            <button id="closeShareModal" class="btn">Close</button>
        </div>
    </div>
</div>

<!-- ================= Delete Confirmation Modal ================= -->
<div id="deleteModal">
    <div id="deleteBox">
        <h3>Confirmation Required</h3>

        <!-- ⭐ UPDATED MESSAGE HERE ⭐ -->
        <p id="deleteMsg">
            Please confirm — proceed with deleting the selected
            <strong id="deleteCount">0</strong>
            <span id="deleteLabel">folder(s)</span>?
        </p>

        <div class="delete-actions">
            <button id="cancelDelete" class="btn">No, Cancel</button>
            <button id="confirmDelete" class="btn btn-danger">Yes, Delete</button>
        </div>
    </div>
</div>


<script>
/* 🔮 EXACTLY SAME JS — ONLY DELETE MESSAGE UPDATED */

let allFolders = [];
let selectedFolders = [];
let currentFolder = null;
let currentFiles = [];
let latestShareUrl = "";

const packetList = document.getElementById('packetList');
const filesBody = document.getElementById('filesBody');
const filesTitle = document.getElementById('filesTitle');
const searchBox = document.getElementById('searchBox');
const sortSelect = document.getElementById('sortSelect');
const refreshBtn = document.getElementById('refreshBtn');
const selectAll = document.getElementById('selectAll');

const downloadBtn = document.getElementById('downloadSelectedBtn');
const shareFolderBtn = document.getElementById('shareFolderBtn');
const deleteFoldersBtn = document.getElementById('deleteFoldersBtn');

const selectedCount = document.getElementById('selectedCount');
const loader = document.getElementById('loader');
const fileLoader = document.getElementById('fileLoader');

const deleteModal = document.getElementById('deleteModal');
const deleteCountSpan = document.getElementById('deleteCount');
const deleteLabel = document.getElementById('deleteLabel');
const cancelDeleteBtn = document.getElementById('cancelDelete');
const confirmDeleteBtn = document.getElementById('confirmDelete');


function loadFolders() {
    loader.style.display = "block";
    packetList.innerHTML = "<div class='list-item'>Loading…</div>";

    fetch(`/api/packet-folders?sort=${sortSelect.value}`)
        .then(r => r.json())
        .then(data => { allFolders = data.folders || []; renderFolders(); })
        .finally(() => loader.style.display = "none");
}

function renderFolders() {
    const q = (searchBox.value || "").toLowerCase();
    const filtered = allFolders.filter(f => f.name.toLowerCase().includes(q));

    packetList.innerHTML = "";

    if (!filtered.length) {
        packetList.innerHTML = "<div class='list-item'>No folders</div>";
        updateButtons();
        return;
    }

    filtered.forEach(f => {
        const row = document.createElement("div");
        row.className = "list-item" + (selectedFolders.includes(f.id) ? " selected-folder" : "");

        row.innerHTML = `
            <input type="checkbox" class="folderChk" data-id="${f.id}" ${selectedFolders.includes(f.id) ? "checked" : ""}>
            <span style="flex:1"><i class="fa fa-folder"></i> ${f.name}</span>
            <span class="muted">${new Date(f.modifiedTime).toLocaleString()}</span>
        `;

        row.addEventListener("click", (e) => {
            if (!e.target.classList.contains("folderChk")) {
                currentFolder = f;
                filesTitle.textContent = "Files — " + f.name;
                loadFiles(f.id);
            }
        });

        packetList.appendChild(row);
    });

    updateButtons();
}

packetList.addEventListener("change", (e) => {
    if (!e.target.classList.contains("folderChk")) return;

    const id = e.target.dataset.id;

    if (e.target.checked) {
        selectedFolders.push(id);
    } else {
        selectedFolders = selectedFolders.filter(x => x !== id);
        selectAll.checked = false;
    }

    renderFolders();
});


selectAll.addEventListener("change", () => {
    selectedFolders = selectAll.checked ? allFolders.map(f => f.id) : [];
    renderFolders();
});

function updateButtons() {
    selectedCount.textContent = selectedFolders.length;
    downloadBtn.disabled = selectedFolders.length === 0;
    shareFolderBtn.disabled = selectedFolders.length !== 1;
    deleteFoldersBtn.disabled = selectedFolders.length === 0;
}


/* ===================== Delete Confirm ===================== */

deleteFoldersBtn.addEventListener("click", () => {
    deleteCountSpan.textContent = selectedFolders.length;

    // 🔥 NEW LINE FOR AUTO folder/folders 
    deleteLabel.textContent = selectedFolders.length === 1 ? "folder" : "folders";

    deleteModal.style.display = "flex";
});

cancelDeleteBtn.addEventListener("click", () => {
    deleteModal.style.display = "none";
});

confirmDeleteBtn.addEventListener("click", async () => {
    deleteModal.style.display = "none";

    const resp = await fetch("/api/delete-folders", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ids: selectedFolders })
    });

    const data = await resp.json();

    alert("Deleted " + selectedFolders.length + " folder(s)");

    selectedFolders = [];
    selectAll.checked = false;

    loadFolders();
});


/* ===================== Files loader ===================== */

function loadFiles(folderId) {
    fileLoader.style.display = "block";
    filesBody.innerHTML = "<tr><td colspan='4'>Loading…</td></tr>";

    fetch(`/api/folder/${folderId}/files`)
        .then(r => r.json())
        .then(data => { currentFiles = data.files || []; renderFiles(); })
        .finally(() => fileLoader.style.display = "none");
}

function renderFiles() {
    const q = (searchBox.value || "").toLowerCase();
    const filtered = currentFiles.filter(f => f.name.toLowerCase().includes(q));

    filesBody.innerHTML = "";

    if (!filtered.length) {
        filesBody.innerHTML = "<tr><td colspan='4'>No files</td></tr>";
        return;
    }

    filtered.forEach(f => {
        const mime = f.mimeType || "";
        const ext = f.name.split(".").pop().toLowerCase();

        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${f.name}</td>
            <td>${mime.replace("application/", "")}</td>
            <td>${new Date(f.modifiedTime).toLocaleString()}</td>
            <td>
                <button class="btn" onclick="openPreview('${f.id}','${mime}','${ext}')"><i class="fa fa-eye"></i></button>
                <a class="btn" href="/download/file/${f.id}"><i class="fa fa-download"></i></a>
                <button class="btn" onclick="shareFile('${f.id}')"><i class="fa fa-share-alt"></i></button>
            </td>
        `;
        filesBody.appendChild(tr);
    });
}


/* ===================== Preview ===================== */

function openPreview(id, mime, ext) {
    previewVideo.style.display = previewImage.style.display = previewFrame.style.display = "none";

    const url = `/preview/file/${id}`;

    if (mime.startsWith("video/")) {
        previewVideo.src = url;
        previewVideo.style.display = "block";
        previewVideo.play();
    }
    else if (mime.startsWith("image/")) {
        previewImage.src = url;
        previewImage.style.display = "block";
    }
    else if (ext === "pdf") {
        previewFrame.src = url;
        previewFrame.style.display = "block";
    }
    else {
        window.open(url, "_blank");
        return;
    }

    previewModal.style.display = "flex";
}

previewClose.addEventListener("click", closePreview);
previewModal.addEventListener("click", (e) => { if (e.target === previewModal) closePreview(); });

function closePreview() {
    previewModal.style.display = "none";
    previewVideo.pause();
    previewVideo.src = "";
    previewImage.src = "";
    previewFrame.src = "";
}


/* ===================== Share Folder ===================== */

shareFolderBtn.addEventListener("click", async () => {
    const folderId = selectedFolders[0];
    shareLink.textContent = "Generating…";
    shareModal.style.display = "flex";

    const resp = await fetch(`/api/share-folder?id=${folderId}`);
    const data = await resp.json();

    latestShareUrl = data.link;
    shareLink.textContent = latestShareUrl;
});

copyShareLink.addEventListener("click", () => {
    navigator.clipboard.writeText(latestShareUrl);
    copyShareLink.textContent = "Copied!";
    setTimeout(() => copyShareLink.textContent = "Copy", 1200);
});

openShareLink.addEventListener("click", () => window.open(latestShareUrl, "_blank"));
closeShareModal.addEventListener("click", () => shareModal.style.display = "none");


/* ===================== General ===================== */

searchBox.addEventListener("input", () => { renderFolders(); renderFiles(); });
sortSelect.addEventListener("change", () => loadFolders());
refreshBtn.addEventListener("click", () => loadFolders());

loadFolders();
</script>

</body>
</html>
